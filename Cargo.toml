[package]
name = "sapphyre_tools"
version = "0.11.36"
edition = "2021"
# Oldest toolchain we build on. Cargo skips dependency versions that need a
# newer rustc, instead of resolving to one and failing at compile time.
rust-version = "1.91"
include = ["/src", "/python", "/pyproject.toml", "/README.md", "/LICENSE"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "sapphyre_tools"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
bio = "4"
itertools = "0.15"
tempfile = "3.27"
fastx = "0.6"
meminterval = "0.4.2"
anyhow = "1"
ahash = "0.8"
seq_io = "0.3"
flate2 = { version = "1", features = ["zlib-ng"] }
# Must cover every codec --nt-compression can select; exon_dp opens the nt DB.
rust-rocksdb = { version = "0.52", default-features = false, features = ["zstd", "lz4", "snappy", "bindgen-runtime"] }


[profile.dev]
opt-level = 3

