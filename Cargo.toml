[package]
name = "sapphyre_tools"
version = "0.13.11"
edition = "2021"
license = "GPL-3.0-or-later"
# Oldest toolchain we build on. Cargo skips dependency versions that need a
# newer rustc, instead of resolving to one and failing at compile time.
rust-version = "1.91"
include = ["/src", "/python", "/pyproject.toml", "/README.md", "/LICENSE", "/LICENSE-THIRD-PARTY"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "sapphyre_tools"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29"
tempfile = "3.27"
# SIMD Hamming distance.
triple_accel = "0.4"
anyhow = "1"
ahash = "0.8"
# Already in the tree; named here so the N scan can use memchr2.
memchr = "2"
# Already in the tree; madvise for the dedupe buffers.
libc = "0.2"
seq_io = "0.3"
flate2 = { version = "1", features = ["zlib-ng"] }


[features]
# On by default so maturin and `cargo build` make an extension module as before.
# The test binary must link libpython instead: `cargo test --no-default-features`.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.dev]
opt-level = 3

